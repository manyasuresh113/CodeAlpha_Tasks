<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EchoBeat</title>

    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/splash.css">

</head>

<body>

    <!-- Animated Background -->

    <div class="gradient-bg"></div>

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Splash Container -->

    <div class="splash-container">

        <!-- Logo -->

        <div class="logo-container">

            <img
                src="assets/logo.png"
                alt="EchoBeat Logo"
                class="logo">

        </div>

        <!-- App Name -->

        <h1 class="app-name">

            EchoBeat

        </h1>

        <!-- Tagline -->

        <p class="tagline">

            YOUR MUSIC. YOUR WORLD.

        </p>

        <!-- Equalizer -->

        <div class="equalizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <!-- Loading -->

        <p class="loading-text">

            Initializing Experience...

        </p>

        <!-- Progress -->

        <div class="progress">

            <div class="progress-fill"></div>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        Built with ❤️ by Manya Suresh

    </footer>

    <script src="js/splash.js"></script>

</body>

</html>
